# Stephen King novels, first-publication order.
# The timeline sorts on `date` and alternates sides automatically.
# `year` is the heading year. `source` is a Wikipedia or stephenking.com page.
# Optional `comic` draws a Gramener panel: carrie, salems-lot, or shining.
# Descriptions are original and spoiler-light. Do not paste text from other sites.

- id: carrie
  year: 1974
  date: 1974-04-05
  title: Carrie
  comic: carrie
  source: "https://en.wikipedia.org/wiki/Carrie_(novel)"
  description: >-
    King's first published novel, issued by Doubleday on April 5, 1974.
    Carrie White is a lonely high-school senior whose secret telekinetic gift
    comes out when the cruelty around her finally goes too far.

- id: salem_s_lot
  year: 1975
  date: 1975-10-17
  title: "'Salem's Lot"
  comic: salems-lot
  source: "https://en.wikipedia.org/wiki/%27Salem%27s_Lot"
  description: >-
    King's second novel, published on October 17, 1975. Writer Ben Mears
    comes home to Jerusalem's Lot, Maine, and finds a spreading evil moving
    through the town after dark.

- id: theshining
  year: 1977
  date: 1977-01-28
  title: The Shining
  comic: shining
  source: "https://en.wikipedia.org/wiki/The_Shining_(novel)"
  description: >-
    King's third novel, and his first hardcover bestseller. A recovering
    alcoholic takes a winter job caretaking a remote hotel, and the building
    starts to press on him and his family.

- id: rage
  year: 1977
  date: 1977-09-01
  title: Rage
  source: "https://en.wikipedia.org/wiki/Rage_(King_novel)"
  description: >-
    The first novel King published under the name Richard Bachman, in 1977.
    A troubled student holds his classroom hostage. King later allowed the
    book to go out of print.

- id: thestand
  year: 1978
  date: 1978-10-01
  title: The Stand
  source: "https://en.wikipedia.org/wiki/The_Stand"
  description: >-
    First published by Doubleday in October 1978. A weaponized flu kills most
    of the population, and the people who remain are drawn toward two rival
    camps. A much longer Complete and Uncut edition followed in May 1990.

- id: thelongwalk
  year: 1979
  date: 1979-07-01
  title: The Long Walk
  source: "https://en.wikipedia.org/wiki/The_Long_Walk"
  description: >-
    Published in 1979 under the Richard Bachman name. In a grim future,
    teenage boys enter a walking contest that does not let them stop.

- id: thedeadzone
  year: 1979
  date: 1979-08-01
  title: The Dead Zone
  source: "https://en.wikipedia.org/wiki/The_Dead_Zone_(novel)"
  description: >-
    Published in August 1979. Johnny Smith wakes from a years-long coma with
    brief, uncontrollable glimpses of the future, and has to decide what those
    visions are worth.

- id: firestarter
  year: 1980
  date: 1980-09-29
  title: Firestarter
  source: "https://en.wikipedia.org/wiki/Firestarter_(novel)"
  description: >-
    Published on September 29, 1980. A young girl who can start fires is on
    the run with her father from the agency that experimented on her parents.

- id: roadwork
  year: 1981
  date: 1981-03-01
  title: Roadwork
  source: "https://en.wikipedia.org/wiki/Roadwork_(novel)"
  description: >-
    A 1981 Richard Bachman novel. A man whose home and workplace are about to
    be torn down for a highway extension refuses to get out of the way.

- id: cujo
  year: 1981
  date: 1981-09-08
  title: Cujo
  source: "https://en.wikipedia.org/wiki/Cujo"
  description: >-
    Published on September 8, 1981. A St. Bernard bitten by a rabid bat
    becomes a deadly trap for a mother and son stranded at a remote garage.

- id: therunningman
  year: 1982
  date: 1982-05-01
  title: The Running Man
  source: "https://en.wikipedia.org/wiki/The_Running_Man_(novel)"
  description: >-
    A 1982 Richard Bachman novel. A desperate man joins a televised hunt in
    which the public is invited to track him down.

- id: thegunslinger
  year: 1982
  date: 1982-06-01
  title: "The Dark Tower: The Gunslinger"
  source: "https://en.wikipedia.org/wiki/The_Dark_Tower:_The_Gunslinger"
  description: >-
    The first Dark Tower novel, published in June 1982. Roland, the last
    gunslinger, follows the man in black across a desert world toward the
    Tower.

- id: christine
  year: 1983
  date: 1983-04-29
  title: Christine
  source: "https://en.wikipedia.org/wiki/Christine_(King_novel)"
  description: >-
    Published on April 29, 1983. A teenager buys a battered 1958 Plymouth,
    and the car's jealousy begins to take him over.

- id: petsematary
  year: 1983
  date: 1983-11-01
  title: Pet Sematary
  source: "https://en.wikipedia.org/wiki/Pet_Sematary"
  description: >-
    Published in November 1983. A doctor in rural Maine learns that the
    ground beyond a local pet cemetery can return what is buried there, and
    that the price of using it is terrible.

- id: cycleofthewerewolf
  year: 1983
  date: 1983-12-01
  title: Cycle of the Werewolf
  source: "https://en.wikipedia.org/wiki/Cycle_of_the_Werewolf"
  description: >-
    An illustrated short novel from 1983, with art by Bernie Wrightson. Each
    chapter is one full moon, and a werewolf is hunting a small Maine town.

- id: talisman
  year: 1984
  date: 1984-11-08
  title: The Talisman
  source: "https://en.wikipedia.org/wiki/The_Talisman_(King_and_Straub_novel)"
  description: >-
    A November 1984 novel written with Peter Straub. Twelve-year-old Jack
    Sawyer crosses America, and a twin country called the Territories, looking
    for the one thing that might save his mother.

- id: theeyesofthedragon
  year: 1984
  date: 1984-11-15
  title: The Eyes of the Dragon
  source: "https://en.wikipedia.org/wiki/The_Eyes_of_the_Dragon"
  description: >-
    A fantasy first issued in a limited Philtrum Press edition in 1984, then
    published more widely in 1987. Prince Peter is framed for the king's
    murder and has to find a way out of the tower where he is locked away.

- id: thinner
  year: 1984
  date: 1984-11-19
  title: Thinner
  source: "https://en.wikipedia.org/wiki/Thinner_(novel)"
  description: >-
    Published in November 1984 under the Richard Bachman name. After a lawyer
    escapes punishment for a fatal accident, a curse sets him wasting away.

- id: it
  year: 1986
  date: 1986-09-15
  title: IT
  source: "https://en.wikipedia.org/wiki/It_(novel)"
  description: >-
    Published in September 1986. Seven friends in Derry, Maine, face a
    shape-shifting predator that hunts children, then come back as adults
    when it wakes again.

- id: thedrawingofthethree
  year: 1987
  date: 1987-05-01
  title: "The Dark Tower II: The Drawing of the Three"
  source: "https://en.wikipedia.org/wiki/The_Drawing_of_the_Three"
  description: >-
    The second Dark Tower novel, published in May 1987. Wounded on a beach,
    Roland opens doors onto another world and draws companions through them.

- id: misery
  year: 1987
  date: 1987-06-08
  title: Misery
  source: "https://en.wikipedia.org/wiki/Misery_(novel)"
  description: >-
    Published by Viking on June 8, 1987. After a crash, novelist Paul Sheldon
    wakes in the care of Annie Wilkes, a fan who will not let him leave until
    he writes the story she wants.

- id: thetommyknockers
  year: 1987
  date: 1987-11-01
  title: The Tommyknockers
  source: "https://en.wikipedia.org/wiki/The_Tommyknockers"
  description: >-
    Published in November 1987. In the Maine town of Haven, people begin to
    change after a strange object is uncovered in the woods.

- id: thedarkhalf
  year: 1989
  date: 1989-11-01
  title: The Dark Half
  source: "https://en.wikipedia.org/wiki/The_Dark_Half"
  description: >-
    Published in November 1989. After writer Thad Beaumont publicly retires a
    violent pen name, that pseudonym seems to climb out of the grave and
    start killing.

- id: thewastelands
  year: 1991
  date: 1991-08-01
  title: "The Dark Tower III: The Waste Lands"
  source: "https://en.wikipedia.org/wiki/The_Dark_Tower_III:_The_Waste_Lands"
  description: >-
    The third Dark Tower novel, published in August 1991. Roland's group
    pushes on toward a ruined city, while one boy's mind is split between
    two worlds.

- id: needfulthings
  year: 1991
  date: 1991-10-01
  title: Needful Things
  source: "https://en.wikipedia.org/wiki/Needful_Things"
  description: >-
    Published in October 1991. A new shop in Castle Rock sells people the
    thing they want most, and the price turns the town against itself.

- id: gerald_s_game
  year: 1992
  date: 1992-05-01
  title: Gerald's Game
  source: "https://en.wikipedia.org/wiki/Gerald%27s_Game"
  description: >-
    Published in May 1992. A woman is left handcuffed to a bed in an empty
    lake house after her husband dies, and she has to survive the room and
    the memories it drags up.

- id: doloresclaiborne
  year: 1992
  date: 1992-11-01
  title: Dolores Claiborne
  source: "https://en.wikipedia.org/wiki/Dolores_Claiborne"
  description: >-
    Published by Viking in November 1992. Told as one unbroken statement to
    the police, a housekeeper on Little Tall Island accounts for her
    employer's death and the marriage that shaped her life.

- id: insomnia
  year: 1994
  date: 1994-09-01
  title: Insomnia
  source: "https://en.wikipedia.org/wiki/Insomnia_(novel)"
  description: >-
    Published in September 1994. Retired widower Ralph Roberts sleeps less
    each night, and the extra waking hours let him see a hidden struggle over
    one life in Derry.

- id: rosemadder
  year: 1995
  date: 1995-06-01
  title: Rose Madder
  source: "https://en.wikipedia.org/wiki/Rose_Madder"
  description: >-
    Published in June 1995. A woman flees an abusive husband and buys a
    painting that opens onto another place, where she may finally be able to
    fight back.

- id: thegreenmile
  year: 1996
  date: 1996-03-01
  title: The Green Mile
  source: "https://en.wikipedia.org/wiki/The_Green_Mile_(novel)"
  description: >-
    A serial novel issued in six monthly parts beginning in March 1996.
    Death-row supervisor Paul Edgecombe tells of John Coffey, a condemned
    prisoner with a healing power no one can explain.

- id: desperation
  year: 1996
  date: 1996-09-24
  title: Desperation
  source: "https://en.wikipedia.org/wiki/Desperation_(novel)"
  description: >-
    Published on September 24, 1996, the same day as its mirror novel, The
    Regulators. Travelers pulled over in a nearly empty Nevada town find that
    the sheriff is no longer acting alone.

- id: theregulators
  year: 1996
  date: 1996-09-25
  title: The Regulators
  source: "https://en.wikipedia.org/wiki/The_Regulators"
  description: >-
    Issued under the Richard Bachman name on September 24, 1996, as the twin
    of Desperation. On a quiet suburban street, an attack arrives in the shape
    of a child's television heroes.

- id: wizardandglass
  year: 1997
  date: 1997-11-04
  title: "The Dark Tower IV: Wizard and Glass"
  source: "https://en.wikipedia.org/wiki/Wizard_and_Glass"
  description: >-
    The fourth Dark Tower novel, published in November 1997. Most of the book
    is Roland's story of his first love and the fall of the kingdom he came
    from.

- id: bagofbones
  year: 1998
  date: 1998-09-22
  title: Bag of Bones
  source: "https://en.wikipedia.org/wiki/Bag_of_Bones"
  description: >-
    Published by Scribner on September 22, 1998. Four years after his wife's
    death, a novelist with writer's block returns to their lake house in Maine
    and finds the town is still keeping an old secret.

- id: thegirlwholovedtomgordon
  year: 1999
  date: 1999-04-01
  title: The Girl Who Loved Tom Gordon
  source: "https://en.wikipedia.org/wiki/The_Girl_Who_Loved_Tom_Gordon"
  description: >-
    Published in April 1999. Nine-year-old Trisha steps off an Appalachian
    trail and has to last in the woods, talking to her favorite Red Sox
    pitcher to keep from panicking.

- id: dreamcatcher
  year: 2001
  date: 2001-02-20
  title: Dreamcatcher
  source: "https://en.wikipedia.org/wiki/Dreamcatcher_(novel)"
  description: >-
    Published by Scribner on February 20, 2001. Four childhood friends, still
    tied to a rescue from years before, meet something that is not from Earth
    on a hunting trip in the Maine woods.

- id: blackhouse
  year: 2001
  date: 2001-09-15
  title: Black House
  source: "https://en.wikipedia.org/wiki/Black_House_(novel)"
  description: >-
    Written with Peter Straub and published on September 15, 2001, as the
    sequel to The Talisman. Retired detective Jack Sawyer, living in
    Wisconsin, is pulled back toward the Territories by a child killer.

- id: fromabuick8
  year: 2002
  date: 2002-09-24
  title: From a Buick 8
  source: "https://en.wikipedia.org/wiki/From_a_Buick_8"
  description: >-
    Published by Scribner on September 24, 2002. Pennsylvania troopers have
    kept a car that is not really a car locked in a shed, and a dead trooper's
    son wants to know why.

- id: wolvesofthecalla
  year: 2003
  date: 2003-11-04
  title: "The Dark Tower V: Wolves of the Calla"
  source: "https://en.wikipedia.org/wiki/Wolves_of_the_Calla"
  description: >-
    The fifth Dark Tower novel, published in November 2003. Roland's ka-tet
    agrees to help a farming community whose children are stolen by raiders
    known as the Wolves.

- id: songofsusannah
  year: 2004
  date: 2004-06-08
  title: "The Dark Tower VI: Song of Susannah"
  source: "https://en.wikipedia.org/wiki/Song_of_Susannah"
  description: >-
    The sixth Dark Tower novel, published in June 2004. The ka-tet is split:
    one of them is carried into our world, and the others race to follow.

- id: thedarktower
  year: 2004
  date: 2004-09-21
  title: "The Dark Tower VII: The Dark Tower"
  source: "https://en.wikipedia.org/wiki/The_Dark_Tower_VII:_The_Dark_Tower"
  description: >-
    The seventh Dark Tower novel, published by Grant on September 21, 2004.
    Roland's long pursuit of the Tower comes to its end.

- id: thecoloradokid
  year: 2005
  date: 2005-10-01
  title: The Colorado Kid
  source: "https://en.wikipedia.org/wiki/The_Colorado_Kid"
  description: >-
    A 2005 mystery published by Hard Case Crime. Two old newspapermen tell an
    intern about an unidentified body on a Maine island, and about the clues
    that never quite close the case.

- id: cell
  year: 2006
  date: 2006-01-24
  title: Cell
  source: "https://en.wikipedia.org/wiki/Cell_(novel)"
  description: >-
    Published by Scribner on January 24, 2006. A signal sent through cell
    phones turns anyone who hears it into something violent and hive-minded,
    and an artist in Boston tries to reach his son.

- id: lisey_s_story
  year: 2006
  date: 2006-10-24
  title: Lisey's Story
  source: "https://en.wikipedia.org/wiki/Lisey%27s_Story"
  description: >-
    Published on October 24, 2006. Widow Lisey Landon, sorting her famous
    husband's papers, finds that the private language of their marriage points
    toward a place he never fully explained.

- id: blaze
  year: 2007
  date: 2007-06-12
  title: Blaze
  source: "https://en.wikipedia.org/wiki/Blaze_(novel)"
  description: >-
    An early manuscript, written before Carrie, and published in 2007 under
    the Richard Bachman name. A gentle small-time crook tries to carry out a
    kidnapping his dead partner planned.

- id: dumakey
  year: 2008
  date: 2008-01-22
  title: Duma Key
  source: "https://en.wikipedia.org/wiki/Duma_Key"
  description: >-
    Published by Scribner on January 22, 2008. After a construction accident,
    a man moves to a Florida island to paint, and the pictures start showing
    him things he should not be able to see.

- id: underthedome
  year: 2009
  date: 2009-11-10
  title: Under the Dome
  source: "https://en.wikipedia.org/wiki/Under_the_Dome_(novel)"
  description: >-
    Published in November 2009. An invisible barrier drops over the Maine town
    of Chester's Mill, and as supplies run short a local politician tightens
    his hold.

- id: 11_22_63
  year: 2011
  date: 2011-11-08
  title: 11/22/63
  source: "https://en.wikipedia.org/wiki/11/22/63"
  description: >-
    Published on November 8, 2011. A diner owner finds a doorway back to 1958
    and sets out to stop the assassination of John F. Kennedy, learning that
    the past pushes back when it is changed.

- id: thewindthroughthekeyhole
  year: 2012
  date: 2012-04-24
  title: "The Dark Tower: The Wind Through the Keyhole"
  source: "https://en.wikipedia.org/wiki/The_Wind_Through_the_Keyhole"
  description: >-
    A 2012 Dark Tower novel set between Wizard and Glass and Wolves of the
    Calla. Caught in a storm, Roland tells a story from his youth, and that
    story contains another one.

- id: joyland
  year: 2013
  date: 2013-06-04
  title: Joyland
  source: "https://en.wikipedia.org/wiki/Joyland_(novel)"
  description: >-
    A June 2013 novel for Hard Case Crime. A college student takes a summer
    job at a North Carolina amusement park and is drawn into the unsolved
    murder of a girl who died there.

- id: doctorsleep
  year: 2013
  date: 2013-09-24
  title: Doctor Sleep
  source: "https://en.wikipedia.org/wiki/Doctor_Sleep_(novel)"
  description: >-
    The sequel to The Shining, published by Scribner on September 24, 2013.
    Adult Dan Torrance is trying to stay sober when a girl with a gift like
    his shine is hunted by a traveling group that feeds on children.

- id: mr_mercedes
  year: 2014
  date: 2014-06-03
  title: Mr. Mercedes
  source: "https://en.wikipedia.org/wiki/Mr._Mercedes"
  description: >-
    Published in June 2014, the first Bill Hodges novel. A retired detective
    is pulled back to work by the man who drove a stolen Mercedes into a job
    line and was never caught.

- id: revival
  year: 2014
  date: 2014-11-11
  title: Revival
  source: "https://en.wikipedia.org/wiki/Revival_(novel)"
  description: >-
    Published by Scribner on November 11, 2014. From boyhood on, Jamie Morton's
    life keeps crossing an obsessive minister whose experiments with
    electricity reach past both faith and medicine.

- id: finderskeepers
  year: 2015
  date: 2015-06-02
  title: Finders Keepers
  source: "https://en.wikipedia.org/wiki/Finders_Keepers_(King_novel)"
  description: >-
    The second Bill Hodges novel, published on June 2, 2015. A boy finds the
    stolen notebooks of a murdered writer, and the man who buried them is
    getting out of prison.

- id: endofwatch
  year: 2016
  date: 2016-06-07
  title: End of Watch
  source: "https://en.wikipedia.org/wiki/End_of_Watch_(novel)"
  description: >-
    The last Bill Hodges novel, published on June 7, 2016. The Mercedes
    killer, near death in a hospital, finds a way to keep reaching new
    victims.

- id: gwendy_s_buttonbox
  year: 2017
  date: 2017-05-16
  title: Gwendy's Button Box
  source: "https://en.wikipedia.org/wiki/Gwendy%27s_Button_Box"
  description: >-
    A novella written with Richard Chizmar and published by Cemetery Dance on
    May 16, 2017. A stranger gives twelve-year-old Gwendy Peterson a box of
    colored buttons and a responsibility she cannot put down.

- id: sleepingbeauties
  year: 2017
  date: 2017-09-26
  title: Sleeping Beauties
  source: "https://en.wikipedia.org/wiki/Sleeping_Beauties_(novel)"
  description: >-
    Written with Owen King and published on September 26, 2017. Women around
    the world fall asleep wrapped in cocoons, and the town of Dooling, West
    Virginia, starts to come apart without them.

- id: theoutsider
  year: 2018
  date: 2018-05-22
  title: The Outsider
  source: "https://en.wikipedia.org/wiki/The_Outsider_(King_novel)"
  description: >-
    Published by Scribner in May 2018. A small-town detective arrests a man
    who seems undeniably guilty of a child's murder, then finds proof that
    the same man was somewhere else. Holly Gibney joins the case.

- id: elevation
  year: 2018
  date: 2018-10-30
  title: Elevation
  source: "https://en.wikipedia.org/wiki/Elevation_(novella)"
  description: >-
    A novella published by Scribner on October 30, 2018. A man in Castle Rock
    loses weight on the scale without getting any smaller, and the change
    pulls him into a feud splitting his neighborhood.

- id: theinstitute
  year: 2019
  date: 2019-09-10
  title: The Institute
  source: "https://en.wikipedia.org/wiki/The_Institute_(novel)"
  description: >-
    Published by Scribner in September 2019. Gifted children are kidnapped to
    a hidden facility that tests what their minds can do, and one boy tries
    to get out and warn someone.

- id: later
  year: 2021
  date: 2021-03-02
  title: Later
  source: "https://en.wikipedia.org/wiki/Later_(King_novel)"
  description: >-
    Published by Hard Case Crime on March 2, 2021. Jamie Conklin can see and
    talk with the dead, and a corrupt detective forces him to use that gift.

- id: billysummers
  year: 2021
  date: 2021-08-03
  title: Billy Summers
  source: "https://en.wikipedia.org/wiki/Billy_Summers"
  description: >-
    Published by Scribner on August 3, 2021. A war veteran who works as a
    hired killer takes what he means to be a last job, and starts writing his
    own story while he waits.

- id: gwendy_s_finaltask
  year: 2022
  date: 2022-02-15
  title: Gwendy's Final Task
  source: "https://en.wikipedia.org/wiki/Gwendy%27s_Final_Task"
  description: >-
    Written with Richard Chizmar and published on February 15, 2022. An older
    Gwendy, now a public figure, has one last job: get the button box
    somewhere no one else can use it.

- id: fairytale
  year: 2022
  date: 2022-09-06
  title: Fairy Tale
  source: "https://en.wikipedia.org/wiki/Fairy_Tale_(novel)"
  description: >-
    Published by Scribner on September 6, 2022. Teenager Charlie Reade
    inherits the key to a world under a backyard shed and agrees to help the
    dying man, and the dog, who kept that secret.

- id: holly
  year: 2023
  date: 2023-09-05
  title: Holly
  source: "https://en.wikipedia.org/wiki/Holly_(novel)"
  description: >-
    Published by Scribner on September 5, 2023. Private investigator Holly
    Gibney, on leave and grieving, takes a missing-person case in a
    Midwestern town and finds the trail leads close to home.

- id: neverflinch
  year: 2025
  date: 2025-05-27
  title: Never Flinch
  comic: never-flinch
  source: "https://en.wikipedia.org/wiki/Never_Flinch"
  description: >-
    A Holly Gibney novel published by Scribner on May 27, 2025. Holly is
    drawn into two threats at once: a letter promising a string of killings,
    and a stalker following a feminist speaker on tour.

- id: otherworldsthanthese
  year: 2026
  date: 2026-10-06
  title: Other Worlds Than These
  source: "https://en.wikipedia.org/wiki/Other_Worlds_Than_These"
  description: >-
    The third Talisman novel, published by Scribner on October 6, 2026, and
    credited to Stephen King and Peter Straub. An older Jack Sawyer has to
    act before a threat moving between our world and the Territories can undo
    both.

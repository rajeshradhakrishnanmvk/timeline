---
layout: default
---
<article class="post-wrap">
  <div class="content">
    <h1>{{ page.title }}</h1>
    <p class="post-meta">
      <time datetime="{{ page.date | date: '%Y-%m-%d' }}">{{ page.date | date: "%B %-d, %Y" }}</time>
    </p>
    {{ content }}
    <p class="post-back"><a href="{{ '/' | relative_url }}">Back to the timeline</a></p>
  </div>
</article>

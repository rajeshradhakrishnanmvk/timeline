<!-- _includes/comic-firestarter.html: timeline teaser for the Firestarter entry.
     Panel 1 is shown inline and the eye button opens the modal. The slideshow
     markup copies Carrie: one scene at a time, not a grid. -->
<div class="comic-container {{ comic_side | default: 'comic-right' }}">
  <div class="comic-panel comic-content">
    <div class="comic-caption-top">Firestarter: the premise in 6 panels</div>
    <img src="{{ '/assets/comics/firestarter/panel-1.png' | relative_url }}"
         width="300" height="200" style="width:100%;height:auto;object-fit:cover"
         alt="Andy and Vicky volunteer for a college study">
    <button type="button" class="btn" data-open-comic="firestarter"
            title="Comic book" aria-label="Open the Firestarter comic strip">
      <i class="fa-regular fa-eye" aria-hidden="true"></i>
    </button>
  </div>
</div>

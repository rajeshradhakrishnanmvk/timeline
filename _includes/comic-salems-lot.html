<!-- _includes/comic-salems-lot.html: timeline teaser for the 'Salem's Lot entry.
     Panel 1 is shown inline and the eye button opens the modal. The slideshow
     markup copies Carrie: one scene at a time, not a grid. -->
<div class="comic-container {{ comic_side | default: 'comic-right' }}">
  <div class="comic-panel comic-content">
    <div class="comic-caption-top">'Salem's Lot: the premise in 6 panels</div>
    <img src="{{ '/assets/comics/salems-lot/panel-1.png' | relative_url }}"
         width="300" height="200" style="width:100%;height:auto;object-fit:cover"
         alt="Ben Mears comes home along a tree-lined street in Jerusalem's Lot">
    <button type="button" class="btn" data-open-comic="salems-lot"
            title="Comic book" aria-label="Open the 'Salem's Lot comic strip">
      <i class="fa-regular fa-eye" aria-hidden="true"></i>
    </button>
  </div>
</div>

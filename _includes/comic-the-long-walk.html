<!-- _includes/comic-the-long-walk.html: timeline teaser card for The Long Walk entry.
     Mirrors comic-the-stand.html: shows panel 1 inline, eye button opens the modal. -->
<div class="comic-container {{ comic_side | default: 'comic-right' }}">
  <div class="comic-panel comic-content">
    <div class="comic-caption-top">The Long Walk: the premise in 6 panels</div>
    <img src="{{ '/assets/comics/the-long-walk/panel-1.png' | relative_url }}"
         width="300" height="200" style="width:100%;height:auto;object-fit:cover"
         alt="An officer starts the Long Walk as a boy steps up to the line">
    <button type="button" class="btn" data-open-comic="the-long-walk"
            title="Comic book" aria-label="Open The Long Walk comic strip">
      <i class="fa-regular fa-eye" aria-hidden="true"></i>
    </button>
  </div>
</div>

<!-- _includes/comic-the-gunslinger.html: timeline teaser for the Gunslinger entry.
     Panel 1 is shown inline and the eye button opens the modal. The slideshow
     markup copies Carrie: one scene at a time, not a grid. -->
<div class="comic-container {{ comic_side | default: 'comic-right' }}">
  <div class="comic-panel comic-content">
    <div class="comic-caption-top">The Gunslinger: the premise in 6 panels</div>
    <img src="{{ '/assets/comics/the-gunslinger/panel-1.png' | relative_url }}"
         width="300" height="200" style="width:100%;height:auto;object-fit:cover"
         alt="Roland, the last gunslinger, follows a trail across an endless desert">
    <button type="button" class="btn" data-open-comic="the-gunslinger"
            title="Comic book" aria-label="Open the Gunslinger comic strip">
      <i class="fa-regular fa-eye" aria-hidden="true"></i>
    </button>
  </div>
</div>

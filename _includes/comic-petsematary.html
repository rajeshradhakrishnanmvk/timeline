<!-- _includes/comic-petsematary.html: timeline teaser for the Pet Sematary entry.
     Panel 1 is shown inline and the eye button opens the modal. The slideshow
     markup copies Carrie: one scene at a time, not a grid. -->
<div class="comic-container {{ comic_side | default: 'comic-right' }}">
  <div class="comic-panel comic-content">
    <div class="comic-caption-top">Pet Sematary: the premise in 6 panels</div>
    <img src="{{ '/assets/comics/petsematary/panel-1.png' | relative_url }}"
         width="300" height="200" style="width:100%;height:auto;object-fit:cover"
         alt="Louis Creed and his family arrive at a rural Maine house">
    <button type="button" class="btn" data-open-comic="petsematary"
            title="Comic book" aria-label="Open the Pet Sematary comic strip">
      <i class="fa-regular fa-eye" aria-hidden="true"></i>
    </button>
  </div>
</div>
